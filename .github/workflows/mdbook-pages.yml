name: mdBook build and upload artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (for cargo fallback)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies for mdBook plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar unzip ca-certificates jq
          sudo apt-get install -y openjdk-17-jre-headless graphviz
          npm install -g @mermaid-js/mermaid-cli

      - name: Cache tool binaries and cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/mdbook
            /usr/local/bin/mdbook-mermaid
            /usr/local/bin/mdbook-katex
            /usr/local/bin/mdbook-linkcheck
            /usr/local/bin/mdbook-toc
            /usr/local/bin/mdbook-plantuml
            /usr/local/bin/mdbook-variables
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-mdbook-bin-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mdbook-bin-

      - name: Install mdBook from GitHub release with cargo fallback
        run: |
          set -euxo pipefail
          URL="https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-x86_64-unknown-linux-gnu.tar.gz"
          if curl -fL "$URL" -o /tmp/mdbook.tar.gz; then
            if tar -tzf /tmp/mdbook.tar.gz >/dev/null 2>&1; then
              tar -xzf /tmp/mdbook.tar.gz -C /tmp
              sudo install /tmp/mdbook /usr/local/bin/mdbook
            else
              echo "Downloaded file is not a valid tar.gz, falling back to cargo install"
              cargo install mdbook --version 0.5.4 --locked
            fi
          else
            echo "Download failed, falling back to cargo install"
            cargo install mdbook --version 0.5.4 --locked
          fi
          mdbook --version

      - name: Install mdBook plugin binaries from GitHub releases (with cargo fallback)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mdbook-plugins

          install_or_fallback() {
            crate_name="$1"
            binary_name="$2"
            asset_url="$3"

            echo "Installing ${binary_name} from release (asset: ${asset_url})"
            if curl -fL "$asset_url" -o "/tmp/${binary_name}.tar.gz"; then
              mkdir -p "/tmp/${binary_name}"
              if tar -xzf "/tmp/${binary_name}.tar.gz" -C "/tmp/${binary_name}"; then
                candidate=$(find "/tmp/${binary_name}" -type f -name "${binary_name}" -perm -111 | head -n1 || true)
                if [ -n "$candidate" ]; then
                  sudo install "$candidate" "/usr/local/bin/${binary_name}"
                  chmod +x "/usr/local/bin/${binary_name}"
                  echo "Installed ${binary_name} from release"
                  return 0
                else
                  echo "Binary ${binary_name} not found in archive"
                fi
              else
                echo "Failed to extract archive for ${binary_name}" >&2
              fi
            else
              echo "Download failed for ${binary_name}, will fallback to cargo install" >&2
            fi

            echo "Falling back to cargo install ${crate_name}"
            cargo install "${crate_name}" --locked || true
          }

          install_or_fallback "mdbook-mermaid" "mdbook-mermaid" "https://github.com/badboy/mdbook-mermaid/releases/latest/download/mdbook-mermaid-x86_64-unknown-linux-gnu.tar.gz"
          install_or_fallback "mdbook-katex" "mdbook-katex" "https://github.com/lervag/mdbook-katex/releases/latest/download/mdbook-katex-x86_64-unknown-linux-gnu.tar.gz"
          install_or_fallback "mdbook-linkcheck" "mdbook-linkcheck" "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/latest/download/mdbook-linkcheck-x86_64-unknown-linux-gnu.tar.gz"
          install_or_fallback "mdbook-toc" "mdbook-toc" "https://github.com/badboy/mdbook-toc/releases/latest/download/mdbook-toc-x86_64-unknown-linux-gnu.tar.gz"
          install_or_fallback "mdbook-plantuml" "mdbook-plantuml" "https://github.com/plantuml-mdbook/mdbook-plantuml/releases/latest/download/mdbook-plantuml-x86_64-unknown-linux-gnu.tar.gz"
          install_or_fallback "mdbook-variables" "mdbook-variables" "https://github.com/arkworks-rs/mdbook-variables/releases/latest/download/mdbook-variables-x86_64-unknown-linux-gnu.tar.gz"

      - name: Verify plugin binaries
        run: |
          set -euxo pipefail
          which mdbook || true
          which mdbook-mermaid || true
          which mdbook-katex || true
          which mdbook-linkcheck || true
          which mdbook-toc || true
          which mdbook-plantuml || true
          which mdbook-variables || true
          mdbook --version || true

      - name: Build mdBook site
        run: mdbook build --dest-dir book

      - name: Ensure CNAME for custom domain
        run: |
          mkdir -p book
          echo 'doc.example.com' > book/CNAME

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./book
          if-no-files-found: error
