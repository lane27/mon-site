name: mdBook build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook 0.5.9
        run: cargo install mdbook --version 0.5.9

      - name: Build mdBook site
        run: mdbook build

      - name: Ensure CNAME for custom domain
        run: |
          mkdir -p book
          echo 'doc.example.com' > book/CNAME

      - name: Create ZIP artifact
        run: zip -r mdbook-site.zip book

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdbook-site
          path: ./mdbook-site.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
