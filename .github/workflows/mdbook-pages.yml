name: Deploy mdBook

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

# Grant permissions needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Standard action to download pre-compiled mdBook & plugins
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'
          # Uncomment if using plugins like mdbook-mermaid:
          # mdbook-mermaid-version: 'latest'

      # 2. Build the mdBook site
      - name: Build with mdBook
        run: mdbook build

      # 3. Setup Official GitHub Pages environment
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Upload build artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book  # Default output directory generated by mdbook build

      # 5. Deploy artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
